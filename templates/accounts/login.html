{% load static %}
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acessar · Video Studio</title><link rel="stylesheet" href="{% static 'css/studio.css' %}"></head><body class="login-page"><main class="login-card panel"><a class="brand" href="{% url 'studio:library' %}"><img src="{% static 'img/logo.svg' %}" alt="" width="36" height="36">Video Studio</a><h1>Bem-vindo ao Studio</h1><p>Acesse com sua conta para continuar.</p><form method="post">{% csrf_token %}{% if form.errors %}<p class="form-error" role="alert">E-mail ou senha inválidos. Confira os dados e tente novamente.</p>{% endif %}<div class="field"><label for="id_username">E-MAIL</label><input id="id_username" name="username" type="email" required autocomplete="username"></div><div class="field"><label for="id_password">SENHA</label><input id="id_password" name="password" type="password" required autocomplete="current-password"></div><input type="hidden" name="next" value="{{ next }}"><button type="submit" class="button primary full-width">Entrar no Studio</button></form>{% if ui_demo %}<a class="text-button" href="{% url 'studio:library' %}">Explorar a interface de demonstração →</a>{% endif %}</main></body></html>
