<div class="chapter-row" data-chapter-row data-seconds="{{ chapter.seconds }}" data-end="{{ chapter.end_seconds }}"><button type="button" class="chapter-seek" data-jump="{{ chapter.seconds }}" aria-label="Ir para {{ chapter.time }} — {{ chapter.title }}">{% include 'components/icon.html' with name='play' %}<span class="mono">{{ chapter.time }}</span></button><span class="chapter-thumb thumb-podcast"></span><span class="chapter-title">{{ chapter.title }}</span><span class="mono muted-text chapter-length">{{ chapter.length }}</span><button type="button" class="icon-button" data-edit-chapter aria-label="Editar {{ chapter.title }}">{% include 'components/icon.html' with name='edit' %}</button><button type="button" class="icon-button danger" data-remove-chapter aria-label="Remover marcação {{ chapter.title }}">{% include 'components/icon.html' with name='trash' %}</button></div>
