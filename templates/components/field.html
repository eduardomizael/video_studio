<div class="field {{ class }}"><label for="{{ id }}">{{ label }}</label>{% if multiline %}<textarea id="{{ id }}" name="{{ id }}" rows="{{ rows|default:4 }}" {% if maxlength %}maxlength="{{ maxlength }}" data-counter="{{ id }}-count"{% endif %}>{{ value }}</textarea>{% else %}<input id="{{ id }}" name="{{ id }}" type="{{ type|default:'text' }}" value="{{ value }}" {% if required %}required{% endif %} {% if maxlength %}maxlength="{{ maxlength }}" data-counter="{{ id }}-count"{% endif %}>{% endif %}{% if maxlength %}<small class="field-count mono" id="{{ id }}-count">{{ value|length }}/{{ maxlength }}</small>{% endif %}{% if hint %}<small>{{ hint }}</small>{% endif %}</div>
