<header class="topbar"><form class="global-search" action="{% url 'studio:library' %}" method="get" role="search">{% include 'components/icon.html' with name='search' %}<input type="search" name="q" value="{{ query }}" placeholder="Buscar vídeos por título ou descrição…" aria-label="Buscar na biblioteca"><kbd>/</kbd></form><div class="header-actions"><span class="local-status"><span class="status-dot"></span> Catálogo Local</span><div class="popover-anchor"><button type="button" class="user-trigger" data-popover="user-menu" aria-label="Menu de {{ studio_user.name }}" aria-expanded="false" aria-controls="user-menu"><span class="initial-avatar">{{ studio_user.initials }}</span><span><strong>{{ studio_user.name }}</strong><small>{{ studio_user.email }}</small></span>{% include 'components/icon.html' with name='chevron' %}</button><div id="user-menu" class="popover user-popover" hidden><div class="user-menu-summary"><span class="initial-avatar">{{ studio_user.initials }}</span><div><strong>{{ studio_user.name }}</strong><small>{{ studio_user.email }}</small></div></div><a class="menu-link" href="{% url 'studio:profile' %}">Minha conta</a><a class="menu-link" href="{% url 'studio:library' %}">Biblioteca de Mídia</a>{% if request.user.is_authenticated %}<form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="menu-link danger" type="submit">Sair da conta</button></form>{% endif %}</div></div></div></header>
