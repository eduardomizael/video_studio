<article class="subtitle-row"><div class="subtitle-row-heading"><span class="badge purple mono">{{ subtitle.start }} → {{ subtitle.end }}</span><span class="mono speaker">{{ subtitle.speaker }}</span></div><label class="sr-only" for="subtitle-{{ forloop.counter }}">Texto da legenda {{ forloop.counter }}</label><textarea id="subtitle-{{ forloop.counter }}" rows="3">{{ subtitle.text }}</textarea><div class="subtitle-times"><label>Início<input type="text" value="{{ subtitle.start }}" class="mono" aria-label="Início da legenda {{ forloop.counter }}"></label><label>Fim<input type="text" value="{{ subtitle.end }}" class="mono" aria-label="Fim da legenda {{ forloop.counter }}"></label></div></article>
