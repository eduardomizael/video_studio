<div class="tag-editor" data-tag-editor><div class="tag-list">{% for tag in video.tags %}<span class="tag-chip">{{ tag }}<button type="button" data-remove-chip aria-label="Remover associação de {{ tag }}">{% include 'components/icon.html' with name='close' %}</button></span>{% endfor %}</div><label class="sr-only" for="new-tag">Adicionar tag</label><input id="new-tag" placeholder="Digite uma nova tag e pressione Enter…" maxlength="50" data-tag-input><small class="muted-text">Sugestões: <button type="button" class="text-button" data-add-chip="Tecnologia">+ Tecnologia</button><button type="button" class="text-button" data-add-chip="Inovação">+ Inovação</button><button type="button" class="text-button" data-add-chip="Produtividade">+ Produtividade</button></small></div>
