<article class="media-card {% if video.id == 1 %}selected{% endif %}" data-media-card="{{ video.id }}">
  <div class="media-thumb thumb-{{ video.thumb }}"><span class="thumb-quality mono">{{ video.resolution }}</span><input type="checkbox" class="card-select" aria-label="Selecionar {{ video.title }}" data-select-video="{{ video.id }}"><a href="{% url 'studio:editor' video.id %}" class="thumb-open" aria-label="Abrir {{ video.title }}"></a><span class="thumb-duration mono">{{ video.duration }}</span></div>
  <div class="media-card-content"><div class="card-status"><span class="status-dot {{ video.tone }}"></span>{{ video.status }}</div><a class="media-title" href="{% url 'studio:editor' video.id %}" title="{{ video.title }}">{{ video.title }}</a><div class="media-meta mono">{{ video.size }} · {{ video.codec }}</div><div class="card-tags">{% for tag in video.tags|slice:':2' %}{% include 'components/badge.html' with label=tag tone='muted' %}{% endfor %}</div><div class="card-footer"><small>{{ video.updated }}</small><button type="button" class="text-button" data-inspect="{{ video.id }}" aria-label="Inspecionar {{ video.title }}">Inspecionar {% include 'components/icon.html' with name='chevron' %}</button></div></div>
</article>
