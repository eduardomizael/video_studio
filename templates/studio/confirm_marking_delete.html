{% extends 'base.html' %}
{% block content %}<section class="panel"><h1>Remover marcação</h1><p>Remover “{{ marking.title }}” de “{{ record.title }}”?</p><p class="muted-text">Somente esta marcação e suas associações serão removidas. O vídeo, o arquivo e os cadastros globais de tags/pessoas serão preservados.</p><form method="post" action="{% url 'studio:remove_marking' record.pk marking.pk %}">{% csrf_token %}<div class="dialog-actions"><a class="button secondary" href="{% url 'studio:chapters' record.pk %}">Cancelar</a><button class="button primary" type="submit">Remover marcação</button></div></form></section>{% endblock %}
