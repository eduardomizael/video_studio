{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><h1>Remover entrada de legenda</h1><p>{{ record.title }} · {{ version.name }}</p></div></div><section class="panel"><p class="subtitle-entry-text">{{ entry.text }}</p><p>Somente esta entrada será removida. A versão, o vídeo e o arquivo serão preservados.</p><form method="post" action="{% url 'studio:remove_subtitle_entry' record.pk version.pk entry.pk %}">{% csrf_token %}<button class="button primary" type="submit">Confirmar remoção</button> <a class="button secondary" href="{% url 'studio:subtitle_version' record.pk version.pk %}">Cancelar</a></form></section>{% endblock %}
